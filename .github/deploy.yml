name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger the action when there’s a push to the main branch.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install

      - name: Build the project (optional, depending on setup)
        run: |
          # If you need to build the project, run your build commands here
          # npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch where GitHub Pages will be deployed
          folder: .         # The folder to deploy (you can adjust this if needed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
